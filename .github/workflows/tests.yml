name: Tests

# Runs on every push and pull request. No production access, no secrets: the browser
# tests use a mocked API. Every browser test runs as Android Chrome, iPhone Safari
# (WebKit) and the small iPhone SE screen, because shoppers use phones.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest tests -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --reporter=list,github
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-screenshots
          path: frontend/test-results/
          retention-days: 14
